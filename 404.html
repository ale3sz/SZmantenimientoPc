<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada (404) | SZ Mantenimiento de PC</title>
  <meta name="description" content="La página que buscas no existe o ha sido movida. Volvé al inicio de SZ Mantenimiento de PC." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#141311" />

  <!-- Favicon oficial: Logo SZ PNG transparente crema -->
  <link rel="icon" type="image/png" href="./graficas/logo/logo_sz_transparente_crema.png" />
  <link rel="apple-touch-icon" href="./graficas/logo/logo_sz_transparente_crema.png" />
  <link rel="manifest" href="./site.webmanifest" />

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Estilos base -->
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/base.css" />

  <style>
    body {
      background-color: var(--fr-night);
      color: var(--fr-paper-light);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
      background-image: radial-gradient(rgba(244, 208, 111, 0.08) 1px, transparent 1px);
      background-size: 16px 16px;
    }
    .error-card {
      max-width: 620px;
      width: 100%;
      background: var(--fr-night-2);
      border: 3px solid var(--fr-red);
      border-radius: var(--retro-radius-poster);
      padding: 44px 36px;
      text-align: center;
      box-shadow: 10px 10px 0 var(--fr-ink), 0 0 30px rgba(0,0,0,0.5);
      position: relative;
    }
    .error-badge {
      display: inline-block;
      background: var(--fr-red);
      color: var(--fr-paper-light);
      font: 700 13px var(--font-label);
      letter-spacing: 0.14em;
      padding: 5px 14px;
      border-radius: var(--retro-radius-badge);
      text-transform: uppercase;
      margin-bottom: 20px;
      box-shadow: 2px 2px 0 var(--fr-ink);
    }
    .error-mascot {
      width: 160px;
      height: 160px;
      margin: 0 auto 24px;
      border-radius: 50%;
      border: 3px dashed var(--fr-gold);
      padding: 6px;
      background: var(--fr-paper);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 4px 4px 0 var(--fr-ink);
    }
    .error-mascot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }
    .error-code {
      font: 900 clamp(54px, 12vw, 88px)/0.9 var(--font-display);
      color: var(--fr-gold);
      letter-spacing: 0.02em;
      text-shadow: 4px 4px 0 var(--fr-ink);
      margin: 0 0 8px;
    }
    .error-title {
      font: 700 24px var(--font-label);
      color: var(--fr-paper-light);
      margin: 0 0 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .error-desc {
      font: 400 16px/1.5 var(--font-body);
      color: var(--fr-muted-dark);
      margin: 0 auto 30px;
      max-width: 440px;
    }
    .error-actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--fr-red);
      color: var(--fr-paper-light);
      font: 700 15px var(--font-label);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 14px 26px;
      border-radius: var(--retro-radius-badge);
      border: 2px solid var(--fr-paper-light);
      box-shadow: 4px 4px 0 var(--fr-ink);
      transition: transform 0.15s, background-color 0.15s;
      min-height: 48px;
    }
    .btn-home:hover {
      background: #b54339;
      transform: translateY(-2px);
    }
    .btn-wa {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #1e7040;
      color: #fff;
      font: 700 15px var(--font-label);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: var(--retro-radius-badge);
      border: 2px solid var(--fr-paper-light);
      box-shadow: 4px 4px 0 var(--fr-ink);
      transition: transform 0.15s, background-color 0.15s;
      min-height: 48px;
    }
    .btn-wa:hover {
      background: #258c50;
      transform: translateY(-2px);
    }
    @media (max-width: 480px) {
      .error-card { padding: 32px 20px; }
      .error-actions { flex-direction: column; }
      .btn-home, .btn-wa { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <main class="error-card" role="main">
    <div class="error-badge">SZ Mantenimiento · Rosario</div>
    <div class="error-mascot">
      <img src="./graficas/sello.webp" alt="Mascota de SZ Mantenimiento buscando la página" width="160" height="160" />
    </div>
    <h1 class="error-code">404</h1>
    <h2 class="error-title">¡Circuito desconectado!</h2>
    <p class="error-desc">La página que estás buscando no existe, cambió de lugar o está temporalmente fuera de servicio.</p>
    <div class="error-actions">
      <a href="./index.html" class="btn-home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Volver al Inicio
      </a>
      <a href="https://wa.me/5493412580840?text=Hola%20SZ%20Mantenimiento%20PC!%20Estaba%20en%20la%20web%20y%20no%20encontr%C3%A9%20lo%20que%20buscaba." target="_blank" rel="noopener noreferrer" class="btn-wa">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path>
        </svg>
        Consultar por WhatsApp
      </a>
    </div>
  </main>
</body>
</html>
