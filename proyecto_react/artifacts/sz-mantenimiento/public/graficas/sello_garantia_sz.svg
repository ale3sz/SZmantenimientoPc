<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="Sello de garantía técnica SZ 30 a 90 días">
  <defs>
    <path id="topArc" d="M 28,90 A 62,62 0 1,1 152,90" />
    <path id="bottomArc" d="M 20,90 A 70,70 0 0,0 160,90" />
  </defs>
  <!-- Fondo crema impreso -->
  <circle cx="90" cy="90" r="84" fill="#f5ebd6" stroke="#191815" stroke-width="4" />
  <circle cx="90" cy="90" r="76" fill="none" stroke="#99372e" stroke-width="2.5" stroke-dasharray="6 4" />
  <circle cx="90" cy="90" r="50" fill="#99372e" stroke="#191815" stroke-width="3" />
  <circle cx="90" cy="90" r="44" fill="none" stroke="#f4d06f" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Texto curvo superior e inferior -->
  <text fill="#191815" font-family="Oswald, Impact, sans-serif" font-size="13.5" font-weight="700" letter-spacing="2.2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">★ GARANTÍA TÉCNICA ★</textPath>
  </text>
  <text fill="#99372e" font-family="Oswald, Impact, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">TALLER SZ · ROSARIO</textPath>
  </text>

  <!-- Centro del sello -->
  <text x="90" y="83" text-anchor="middle" fill="#f4d06f" font-family="Anton, Impact, sans-serif" font-size="23" letter-spacing="1">30-90</text>
  <text x="90" y="102" text-anchor="middle" fill="#f5ebd6" font-family="Oswald, Impact, sans-serif" font-size="13" font-weight="700" letter-spacing="2">DÍAS</text>
  <path d="M72 110h36" stroke="#f4d06f" stroke-width="1.8" stroke-linecap="round" />
  <text x="90" y="121" text-anchor="middle" fill="#f5ebd6" font-family="Oswald, Impact, sans-serif" font-size="7.8" font-weight="700" letter-spacing="1">RESPALDO REAL</text>
</svg>
